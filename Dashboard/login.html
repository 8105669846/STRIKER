<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STRIker Login</title>
  <style>
    body {
      background: #111c44;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }
    .login-box {
      background: #1d2b5a;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 300px;
    }
    .login-box h2 {
      margin-bottom: 20px;
      text-align: center;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #4e9af1;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .login-box button:hover {
      background: #2f7ad9;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Officer Login</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script>
    const firebaseConfig = {
    apiKey: "AIzaSyCAjGLm5Qk2di9_1nc9zKRYUCxsP8melvI",
    authDomain: "striker-police-dashboard.firebaseapp.com",
    projectId: "striker-police-dashboard",
    storageBucket: "striker-police-dashboard.firebasestorage.app",
    messagingSenderId: "534590523839",
    appId: "1:534590523839:web:861fb206f474b3b2bff90a"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Add login function
  function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        // Redirect to welcome page
        window.location.href = 'welcome.html';
      })
      .catch((error) => {
        alert('Login failed: ' + error.message);
      });
  }
  </script>
  <script type="module" src="authentication.js"></script>

</body>
</html>
